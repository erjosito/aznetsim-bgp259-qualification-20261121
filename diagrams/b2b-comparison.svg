<text x="30" y="49" font-family="Arial,sans-serif" font-size="24" fill="black">Site view: NVA-origin routes during the reversible B2B control</text>
<text x="55" y="136" font-family="Arial,sans-serif" font-size="16" fill="black">B2B off</text>
<text x="55" y="158.4" font-family="Arial,sans-serif" font-size="16" fill="black">NVA unique routes absent</text>
<text x="55" y="180.8" font-family="Arial,sans-serif" font-size="16" fill="black">3 site BGP peers established</text>
<text x="365" y="136" font-family="Arial,sans-serif" font-size="16" fill="black">B2B on</text>
<text x="365" y="158.4" font-family="Arial,sans-serif" font-size="16" fill="black">NVA unique routes present</text>
<text x="365" y="180.8" font-family="Arial,sans-serif" font-size="16" fill="black">3 site BGP peers established</text>
<text x="675" y="136" font-family="Arial,sans-serif" font-size="16" fill="black">B2B restored off</text>
<text x="675" y="158.4" font-family="Arial,sans-serif" font-size="16" fill="black">NVA unique routes absent</text>
