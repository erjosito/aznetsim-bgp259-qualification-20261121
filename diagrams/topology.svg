<text x="30" y="40" font-family="Arial,sans-serif" font-size="20" fill="black">Azure-only BGP qualification: logical resources, not physical instances</text>
<text x="30" y="69" font-family="Arial,sans-serif" font-size="14" fill="black">Dashed green: reversible B2B route-exchange control. Gray: observed endpoint peering paths.</text>
