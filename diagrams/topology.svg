<text x="715" y="121" font-family="Arial,sans-serif" font-size="16" fill="black">VNet C (isolated)</text>
<text x="85" y="184" font-family="Arial,sans-serif" font-size="14" fill="black">Route Server A</text>
<text x="85" y="203.6" font-family="Arial,sans-serif" font-size="14" fill="black">2 returned addresses</text>
<text x="420" y="184" font-family="Arial,sans-serif" font-size="14" fill="black">Route Server B</text>
<text x="420" y="203.6" font-family="Arial,sans-serif" font-size="14" fill="black">2 returned addresses</text>
<text x="83" y="326" font-family="Arial,sans-serif" font-size="16" fill="black">NVA A</text>
<text x="450" y="326" font-family="Arial,sans-serif" font-size="16" fill="black">NVA B</text>
<text x="206" y="379" font-family="Arial,sans-serif" font-size="14" fill="black">VPN active-active</text>
<text x="206" y="398.6" font-family="Arial,sans-serif" font-size="14" fill="black">2 exposed addresses</text>
<text x="740" y="379" font-family="Arial,sans-serif" font-size="14" fill="black">VPN active-standby</text>
<text x="740" y="398.6" font-family="Arial,sans-serif" font-size="14" fill="black">1 active exposed address</text>
<text x="35" y="481" font-family="Arial,sans-serif" font-size="16" fill="black">Each NVA peers with both Route Servers: 4 BGP sessions per NVA (8 sampled total).</text>
<text x="270" y="515" font-family="Arial,sans-serif" font-size="15" fill="black">2 IKE/BGP endpoint paths</text>
